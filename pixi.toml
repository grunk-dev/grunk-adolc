[workspace]
name = "grunk-adolc"
version = "0.1.0"
description = "ADOL-C (algorithmic differentiation) plugin for grunk"
channels = ["conda-forge"]
# Linux-only for now - see DESIGN.md's "Platform scope". The *original* reason
# (swig-adol-c, this plugin's former DLR-internal dependency, never built/verified
# anywhere but Linux) no longer applies now that this plugin links ADOL-C directly
# (see "Native adtl::adouble binding, generated, not hand-written") - ADOL-C itself
# builds cross-platform in principle. Widening this is a real, reasonable,
# currently out-of-scope follow-up, gated on someone actually verifying ADOL-C's
# own autotools-based build on macOS/Windows, not on anything specific to this repo.
platforms = ["linux-64"]

[dependencies]
cmake = "*"
ninja = "*"
lua = "*"
sol2 = "*"
taskflow = "*"
yaml-cpp = "*"
libparametric = "*"
python = ">=3.9"
gtest = "*"
# find_package(PkgConfig REQUIRED)'s own dependency - locates ADOL-C via its own
# adolc.pc (see CMakeLists.txt).
pkg-config = "*"

[pypi-dependencies]
# grunk's own Python bindings, needed by examples/run_example.py - see grunk-occt's
# own pixi.toml for the identical setup and why each of these overrides is needed
# (Taskflow doesn't compile against this pinned commit in this environment; grunk's
# own find_package(parametric REQUIRED) is satisfied by CMAKE_PREFIX_PATH alone, no
# separate parametric_DIR needed). Pinned to the *same* commit as scripts/
# install_grunk.cmake's own GRUNK_REV (CMakeLists.txt's find_package(grunk) doesn't
# pin a commit itself - whatever's installed at .deps/grunk is what it finds - so
# this pin and install_grunk.cmake's are the two that must move together, never
# independently). grunk's own CMakeLists.txt builds grunk_recipe/grunk_plugin as
# SHARED libraries now, so this pip-installed copy dynamically links its own
# bundled copy of them rather than statically embedding one - see grunk's own
# CMakeLists.txt for why that matters.
#
# Also the sole source of the `generate_code` task's own runtime needs now
# (previously this repo's own direct libclang/pyyaml pins, removed): the `grunk`
# console script and its libclang/pyyaml dependencies come along transitively with
# this same pin, since grunk.codegen (grunk/python/grunk/codegen/) now lives in the
# grunk package itself rather than a local codegen/generate.py copy here.
grunk = { git = "https://github.com/grunk-dev/grunk.git", rev = "583da89f0184ef6333000c45573da65a9dd551d0" }

[target.linux-64.activation.env]
# $PIXI_PROJECT_ROOT/.deps/grunk - where scripts/install_grunk.cmake installs grunk
# (see CMakeLists.txt's own find_package(grunk REQUIRED) comment for why this
# replaced FetchContent-vendoring grunk's source) - appended after $CONDA_PREFIX so
# CMake's own config-mode search still checks the conda environment first for
# everything else (Lua, yaml-cpp, parametric, ...), matching every other
# CMAKE_PREFIX_PATH entry in this project.
CMAKE_PREFIX_PATH = "$CONDA_PREFIX:$PIXI_PROJECT_ROOT/.deps/grunk"
SKBUILD_CMAKE_DEFINE = "GRUNK_WITH_TASKFLOW=OFF"
# adolc_plugin.so links directly against ADOL-C's own libadolc.so at *runtime* too,
# not just at link time (see README.md's "Runtime note") - PIXI_PROJECT_ROOT is a
# pixi-provided variable pointing at this repo's own root regardless of cwd, so
# this resolves correctly for every `pixi run` task without needing the exact
# install prefix baked in by name. Only takes effect if ADOL-C was installed into
# scripts/install_adolc.sh's own recommended path (.deps/adolc, not build/_deps/ -
# see that script's own comment for why) - both lib and lib64 are listed since
# which one ADOL-C's own `make install` uses is distro-dependent (see README.md);
# a nonexistent entry here is simply ignored by the dynamic linker/pkg-config, so
# listing both is harmless. Installed ADOL-C somewhere else? export
# LD_LIBRARY_PATH/PKG_CONFIG_PATH yourself instead - see README.md.
LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/.deps/adolc/lib64:$PIXI_PROJECT_ROOT/.deps/adolc/lib:$LD_LIBRARY_PATH"
PKG_CONFIG_PATH = "$PIXI_PROJECT_ROOT/.deps/adolc/lib64/pkgconfig:$PIXI_PROJECT_ROOT/.deps/adolc/lib/pkgconfig:$PKG_CONFIG_PATH"

[tasks]
install_adolc = { cmd = "bash scripts/install_adolc.sh", description = "Download, build, and install ADOL-C 2.7.2 into .deps/adolc (idempotent). See README.md." }

install_grunk = { cmd = "cmake -P scripts/install_grunk.cmake", description = "Clone, build, and install grunk into .deps/grunk (idempotent)." }

generate_code = { cmd = "cmake --build build --target generate_code", description = "Regenerate the native adouble binding (requires -D GRUNK_ADOLC_GENERATE_CODE=ON at configure time)." }

configure = { cmd = [
    "cmake",
    "-G", "Ninja",
    "-S", ".",
    "-B", "build",
    "-D", "CMAKE_INSTALL_PREFIX=build/install",
    "-D", "CMAKE_BUILD_TYPE={{ config }}",
    "-D", "CMAKE_EXPORT_COMPILE_COMMANDS=ON",
], args = [
    { "arg" = "config", "default" = "Release" },
], depends-on = ["install_adolc", "install_grunk"], description = "Configure the CMake build. See README.md." }

build = { cmd = "cmake --build build --parallel", description = "Build the plugin and test harness." }

test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"], description = "Run the test harness." }

install = { cmd = "cmake --install build", depends-on = ["build"], description = "Install adolc_plugin into build/install (CMAKE_INSTALL_PREFIX, set by the configure task) - run `cmake --install build --prefix <path>` directly for a different location." }

run_examples = { cmd = "python examples/run_example.py build/libadolc_plugin.so", depends-on = ["build"], description = "Run the example recipe under examples/ (see README.md's own \"Examples\" section)." }

[tasks.all]
depends-on = ["configure", "build", "test", "run_examples"]
description = "Bootstrap ADOL-C if needed, then configure, build, test, and run the examples."

# REUSE (license-compliance) tooling - its own environment/feature (mirrors
# grunk-occt's own identical addition), since nothing else here needs it and it
# has no reason to affect the default environment's own package set. Adding any
# environment here means pixi no longer creates the "default" one implicitly -
# `default = {}` keeps it exactly as it was (the base [dependencies]/
# [pypi-dependencies], no extra feature).
[environments]
default = { features = [] }
tools = { features = ["tools"], no-default-feature = true }

[feature.tools.dependencies]
python = "*"

[feature.tools.pypi-dependencies]
reuse = "*"

[feature.tools.tasks]
_reuse = { cmd = "reuse {{ sub_cmd }}", args = [
    { "arg" = "sub_cmd", "default" = "lint" },
] }

[tasks.reuse]
args = [{ "arg" = "sub_cmd", "default" = "lint" }]
depends-on = [{ task = "_reuse", environment = "tools", args = ["{{ sub_cmd }}"] }]
description = "Run the REUSE license-compliance tool. sub_cmd selects the REUSE subcommand (e.g. lint, spdx) - defaults to lint."
