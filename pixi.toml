[workspace]
name = "grunk-adolc"
version = "0.1.0"
description = "ADOL-C (algorithmic differentiation) plugin for grunk"
channels = ["conda-forge"]
# Linux-only, deliberately - see DESIGN.md's "Platform scope": ADOL-C itself builds
# fine cross-platform, but swig-adol-c (this plugin's own, DLR-internal dependency -
# see README.md) has only ever been built/verified on Linux, matching the original
# grunk-occt migration plan's own accepted exception for AD-enabled work.
platforms = ["linux-64"]

[dependencies]
cmake = "*"
ninja = "*"
lua = "*"
sol2 = "*"
taskflow = "*"
yaml-cpp = "*"
libparametric = "*"
python = ">=3.9"
gtest = "*"

[pypi-dependencies]
# grunk's own Python bindings, needed by examples/run_example.py - see grunk-occt's
# own pixi.toml for the identical setup and why each of these overrides is needed
# (Taskflow doesn't compile against this pinned commit in this environment; grunk's
# own find_package(parametric REQUIRED) is satisfied by CMAKE_PREFIX_PATH alone, no
# separate parametric_DIR needed). Pinned to the *same* commit as CMakeLists.txt's own
# GIT_TAG - bump both together, never independently.
grunk = { git = "https://github.com/grunk-dev/grunk.git", rev = "c16f519888eae62564145b1ba4c025c1e6dcc6c2" }

[target.linux-64.activation.env]
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"
SKBUILD_CMAKE_DEFINE = "GRUNK_WITH_TASKFLOW=OFF"
# adtl_plugin.so links directly against adtl.so, which in turn depends on ADOL-C's
# own libadolc.so at *runtime* (see README.md's "Runtime note") - PIXI_PROJECT_ROOT
# is a pixi-provided variable pointing at this repo's own root regardless of cwd, so
# this resolves correctly for every `pixi run` task without needing the exact
# install prefix baked in by name. Only takes effect if ADOL-C was installed into
# README.md's own recommended path (build/_deps/ADOL-C/adolc_base) - both lib and
# lib64 are listed since which one ADOL-C's own `make install` uses is
# distro-dependent (see README.md); a nonexistent entry here is simply ignored by
# the dynamic linker, so listing both is harmless. Installed ADOL-C somewhere else?
# export LD_LIBRARY_PATH yourself instead - see README.md.
LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/build/_deps/ADOL-C/adolc_base/lib64:$PIXI_PROJECT_ROOT/build/_deps/ADOL-C/adolc_base/lib:$LD_LIBRARY_PATH"

[tasks]
configure = { cmd = [
    "cmake",
    "-G", "Ninja",
    "-S", ".",
    "-B", "build",
    "-D", "CMAKE_INSTALL_PREFIX=build/install",
    "-D", "CMAKE_BUILD_TYPE={{ config }}",
    "-D", "CMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "-D", "ADTL_LIB_DIR={{ adtl_lib_dir }}",
], args = [
    { "arg" = "config", "default" = "Release" },
    { "arg" = "adtl_lib_dir", "default" = "build/_deps/swig-adol-c/build" },
], description = "Configure the CMake build. See README.md for building ADOL-C/swig-adol-c first." }

build = { cmd = "cmake --build build --parallel", description = "Build the plugin and test harness." }

test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"], description = "Run the test harness." }

run_examples = { cmd = "python examples/run_example.py build/libadtl_plugin.so", depends-on = ["build"], description = "Run the example recipe under examples/ (see README.md's own \"Examples\" section)." }

[tasks.all]
depends-on = ["configure", "build", "test", "run_examples"]
description = "Configure, build, test, and run the examples."
