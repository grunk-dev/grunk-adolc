uses:
  adtl: 2.7.2
  grunk: 0.5.0
parameters:
  x_val: 5.0
modules:
  me: |
    function seed(a)
       ret = adtl.adouble.new(a)
       ret:setADValue(0,1.)
       return ret
    end
steps: |
  y = adtl.adouble.new(17)
  x = me.seed(x_val)
  z = x * y
  w = adtl.sin((z * 6))
  w_value = w:getValue()
  w_derivative = w:getADValue(0)
outputs:
  w: w
  w_value: w_value
  w_derivative: w_derivative
